name: Update bin collection calendar
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh even if the last update was under 21 days ago'
        type: boolean
        required: false
        default: true
permissions:
  contents: write
concurrency:
  group: bin-calendar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Refresh published calendar
        env:
          BIN_UPRN: ${{ secrets.BIN_UPRN }}
          BIN_POSTCODE: ${{ secrets.BIN_POSTCODE }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python bin_schedule.py --force
          else
            python bin_schedule.py
          fi
      - name: Commit calendar if refreshed
        run: |
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/bin_collection_schedule.ics docs/last_success.json
            git commit -m "Update bin collection calendar"
            git push
          else
            echo "Calendar already up to date."
          fi
